<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Kuldeep Lodhi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A0D16" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <!--
      This used to be the spa-github-pages redirect shim, which had two bugs:

      1. `pathSegmentsToKeep = 1` was correct for the old project-pages URL
         (/Protfolio/), but the site now serves from the root domain. At root
         that value eats the first real path segment and mangles the redirect.
      2. It loaded /src/main.tsx, which only exists in dev -- in a production
         build that path 404s, so the shim rendered nothing anyway.

      The app has no client-side router (App.tsx renders Index directly, and
      nothing imports react-router-dom), so there are no client routes to
      rescue. A plain static 404 is the correct behaviour. If you add routing
      later, reinstate the shim with `pathSegmentsToKeep = 0` for a root domain.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0d16;
        color: #e7eaf3;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .code {
        font-size: clamp(4rem, 18vw, 9rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, #7c5cfc, #5b8cff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
      }
      h1 { font-size: 1.375rem; font-weight: 700; margin: 0.75rem 0 0.5rem; }
      p { color: #8c96b4; font-size: 0.9375rem; line-height: 1.6; margin: 0 auto 2rem; max-width: 26rem; }
      a.home {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: #7c5cfc;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      a.home:hover { opacity: 0.9; }
      .mail { display: block; margin-top: 1.5rem; font-size: 0.8125rem; color: #8c96b4; }
      .mail a { color: #5b8cff; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn&rsquo;t exist</h1>
      <p>
        The link may be out of date. Everything lives on the one page &mdash; head back and scroll.
      </p>
      <a class="home" href="/">Back to portfolio</a>
      <span class="mail">
        Or reach me at <a href="mailto:kuldeep921997@gmail.com">kuldeep921997@gmail.com</a>
      </span>
    </main>
  </body>
</html>
