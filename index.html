    <!-- ==================== SOCIAL PREVIEW ====================
         Without these, pasting the link into LinkedIn or WhatsApp shows a
         blank grey card. og:image needs a real 1200x630 PNG at
         public/og-image.png -- until that file exists, platforms simply fall
         back to a text-only preview, which is still far better than nothing.
    -->

    <meta property="og:url" content="https://kuldeep921997.github.io/" />
    <meta property="og:site_name" content="Kuldeep Lodhi" />

    <!-- ==================== FONTS ====================
         Inter is the only family the CSS actually uses (src/index.css sets it
         on both `body` and `.font-display`). Previously this file requested
         Schibsted Grotesk, Playfair Display AND Cormorant Garamond -- three
         families, all downloaded, none referenced -- while Inter came in via a
         render-blocking @import inside index.css. That is four font payloads
         to render one typeface. Now: one family, one request, discovered in
         the initial HTML so it fetches in parallel.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
